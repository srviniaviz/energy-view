name: Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: energy-view-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the Windows app
        id: build
        shell: pwsh
        run: |
          $patch = [int]$env:GITHUB_RUN_NUMBER - 1
          $version = "0.1.$patch"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          dotnet publish -c Release -r win-x64 --self-contained -p:Version=$version -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.build.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler "/DAppVersion=$env:APP_VERSION" installer/EnergyView.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $installer = "dist/release/EnergyView-Setup-$tag-x64.exe"
          $existing = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -eq 'true') {
              gh release upload $tag $installer --clobber
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              gh release edit $tag --draft=false --latest
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            exit 0
          }
          gh release create $tag $installer --target $env:GITHUB_SHA --title "Energy View $tag" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
